<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Tic Tac Toe</h1>

        <div class="mode-select">

            <button id="pvpBtn">Player vs Player</button>

            <button id="aiBtn">Player vs Computer</button>

        </div>

        <div class="target-container">

            <label>Wins Required:</label>

            <select id="targetWins">

                <option value="3">3</option>

                <option value="5">5</option>

                <option value="7">7</option>

                <option value="10">10</option>

            </select>

        </div>

        <div id="status">Player X's Turn</div>

        <div id="rounds">Rounds Completed: 0</div>

        <div id="scoreboard">

            <p>Player X Wins: <span id="xWins">0</span></p>

            <p>Player O Wins: <span id="oWins">0</span></p>

            <p>Draws: <span id="draws">0</span></p>

        </div>

        <div class="board">

            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>

            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>

            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>

        </div>

        <button id="restartBtn">Restart Match</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
